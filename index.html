<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Agent</title>
<style>
body{font-family:sans-serif;margin:0;background:#0b1220;color:#fff}
#log{padding:12px;height:calc(100vh - 80px);overflow:auto}
.m{margin:8px 0;padding:10px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.u{background:#2563eb;margin-left:auto}.a{background:#1f2937}
#bar{display:flex;gap:6px;padding:10px;position:fixed;bottom:0;left:0;right:0;background:#0b1220}
input{flex:1;padding:12px;border-radius:8px;border:0}
button{padding:12px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff}
</style></head><body>
<div id="log"></div>
<div id="bar"><input id="t" placeholder="কিছু লেখো..."><button id="s">পাঠাও</button></div>
<script>
const log=document.getElementById('log'),t=document.getElementById('t');
function add(c,x){const d=document.createElement('div');d.className='m '+c;d.textContent=x;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const q=t.value.trim();if(!q)return;t.value='';add('u',q);const w=add('a','...');
  try{
    const r=await fetch('/.netlify/functions/chat',{method:'POST',body:JSON.stringify({message:q})});
    const j=await r.json();w.textContent=j.reply||j.error||'কিছু ভুল হয়েছে';
  }catch(e){w.textContent='নেটওয়ার্ক সমস্যা'}
}
document.getElementById('s').onclick=send;
t.onkeydown=e=>{if(e.key==='Enter')send()};
</script></body></html>
